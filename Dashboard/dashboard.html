<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <header>Dashboard Admin</header>
    <main>
        <h2>Tambah Paket Data</h2>
        <form id="paket-form">
            <label for="paket-nama">Nama Paket:</label>
            <input type="text" id="paket-nama" required>

            <label for="paket-harga">Harga Paket:</label>
            <input type="text" id="paket-harga" required>

            <label for="paket-gambar">Pilih Gambar:</label>
            <select id="paket-gambar">
                <option value="assets/telkomsel.png">Telkomsel</option>
                <option value="assets/indosat.png">Indosat</option>
                <option value="assets/xl.png">XL</option>
                <option value="assets/tri.png">Tri</option>
                <option value="assets/smartfren.png">Smartfren</option>
            </select>
            <button type="submit">Tambah Paket</button>
        <h2>Daftar Paket Data</h2>
        <div id="paket-list" class="paket-container"></div>
        </form>
        
        <h2>Tambah Top-Up Saldo</h2>
        <form id="topup-form">
            <label for="topup-nominal">Nominal:</label>
            <input type="text" id="topup-nominal" required>

            <label for="topup-gambar">Pilih Gambar:</label>
            <select id="topup-gambar">
                <option value="assets/dana.png">Dana</option>
                <option value="assets/shopeepay.png">Shopeepay</option>
        
            </select>
            <button type="submit">Tambah Top-Up</button>
</form>

        <h2>Daftar Top-Up</h2>
        <div id="topup-list" class="paket-container"></div>
        
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
