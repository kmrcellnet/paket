<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Paket Data</title>
    <style>
        /* Reset & Body */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        /* Container */
        .checkout-container {
            background: white;
            max-width: 400px;
            width: 100%;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        /* Animasi */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Judul */
        h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 15px;
        }

        /* Input Nomor */
        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        /* Pilihan Paket */
        .nominal-container {
            text-align: left;
            margin-top: 15px;
        }

        .nominal-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .nominal {
            background: #28a745;
            color: white;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .nominal:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .nominal.selected {
            background: #ffc107;
            color: black;
            font-weight: bold;
            transform: scale(1.1);
        }

        /* Tombol Pembayaran */
        .pay-btn {
            background: #25D366;
            color: white;
            border: none;
            cursor: pointer;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            margin-top: 20px;
            transition: 0.3s;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
        }

        .pay-btn:hover {
            background: #1DA851;
            transform: scale(1.05);
        }

        /* Responsif */
        @media (max-width: 480px) {
            .checkout-container {
                width: 90%;
            }

            .nominal-list {
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <h2 id="provider-title">Pilih Paket Data</h2>

        <div class="input-group">
            <label for="phone-number">📱 Masukkan Nomor HP:</label>
            <input type="text" id="phone-number" placeholder="08xxxxxxxxxx">
        </div>

        <div class="nominal-container">
            <label>📦 Pilih Paket:</label>
            <div class="nominal-list" id="nominal-container"></div>
        </div>

        <button class="pay-btn" onclick="processCheckout()">💳 Bayar via WhatsApp</button>
    </div>

    <script>
        const dataPackages = {
            axis: [
                { amount: "2GB 3 Hari", price: "Rp5.000" },
                { amount: "5GB 7 Hari", price: "Rp15.000" },
                { amount: "10GB 30 Hari", price: "Rp30.000" }
            ],
            tri: [
                { amount: "3GB 3 Hari", price: "Rp7.000" },
                { amount: "6GB 7 Hari", price: "Rp20.000" }
            ],
            telkomsel: [
                { amount: "2GB 3 Hari", price: "Rp10.000" },
                { amount: "5GB 7 Hari", price: "Rp25.000" }
            ]
        };

        function getProviderFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get("provider") || "axis";
        }

        function updatePackages(provider) {
            let nominalContainer = document.getElementById("nominal-container");
            nominalContainer.innerHTML = "";

            dataPackages[provider].forEach(option => {
                let btn = document.createElement("button");
                btn.classList.add("nominal");
                btn.innerText = `${option.amount}\n${option.price}`;
                btn.onclick = () => selectPackage(btn, provider, option.amount, option.price);
                nominalContainer.appendChild(btn);
            });

            document.getElementById("provider-title").innerText = `Paket Data ${provider.toUpperCase()}`;
        }

        function selectPackage(button, provider, amount, price) {
            document.querySelectorAll(".nominal").forEach(btn => btn.classList.remove("selected"));
            button.classList.add("selected");
            button.dataset.selected = JSON.stringify({ provider, amount, price });
        }

        function processCheckout() {
            let phone = document.getElementById("phone-number").value.trim();
            let selectedPackage = document.querySelector(".nominal.selected");

            if (!phone.match(/^08\d{8,11}$/)) {
                alert("⚠️ Masukkan nomor HP yang valid!");
                return;
            }

            if (!selectedPackage) {
                alert("⚠️ Pilih paket terlebih dahulu!");
                return;
            }

            let { provider, amount, price } = JSON.parse(selectedPackage.dataset.selected);
            let waNumber = "62895401353937";
            let message = `Halo, saya ingin membeli paket:\n📦 ${amount}\n💰 Harga: ${price}\n📱 Nomor HP: ${phone}\n🔌 Provider: ${provider.toUpperCase()}`;
            let waLink = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;
            window.location.href = waLink;
        }

        window.onload = function () {
            updatePackages(getProviderFromURL());
        };
    </script>
</body>
</html>
