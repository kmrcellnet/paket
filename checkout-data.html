<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Paket Data</title>
    <style>
        /* Gaya Umum */
body {
    font-family: 'Poppins', sans-serif;
    background-color: #f8f9fa;
    text-align: center;
    padding: 20px;
    margin: 0;
}

/* Container Checkout */
.checkout-container {
    background: white;
    max-width: 400px;
    margin: auto;
    padding: 20px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    border-radius: 10px;
    text-align: left;
}

/* Judul */
h2 {
    color: #343a40;
    text-align: center;
}

/* Input Form */
.input-group {
    margin-bottom: 15px;
}

label {
    font-weight: 600;
    display: block;
    margin-bottom: 5px;
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ced4da;
    border-radius: 5px;
    font-size: 16px;
    transition: 0.3s;
}

input:focus {
    border-color: #007bff;
    outline: none;
}

/* Pilihan Paket */
.nominal-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

.nominal {
    background: #28a745;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    width: 45%;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    transition: 0.3s;
}

.nominal:hover {
    background: #218838;
}

/* Tombol Pembayaran */
.pay-btn {
    background: #dc3545;
    color: white;
    border: none;
    cursor: pointer;
    width: 100%;
    padding: 12px;
    border-radius: 5px;
    font-size: 16px;
    font-weight: 600;
    transition: 0.3s;
}

.pay-btn:hover {
    background: #c82333;
}

/* Responsif */
@media (max-width: 480px) {
    .checkout-container {
        width: 90%;
    }

    .nominal {
        width: 100%;
    }
}

    </style>
</head>
<body>
    <div class="checkout-container">
        <h2 id="provider-title">Paket Data</h2>

        <div class="input-group">
            <label for="phone-number">📱 Masukkan Nomor HP:</label>
            <input type="text" id="phone-number" placeholder="08xxxxxxxxxx">
        </div>

        <div class="input-group">
            <label>📦 Pilih Paket:</label>
            <div class="nominal-list" id="nominal-container"></div>
        </div>

        <button class="pay-btn" onclick="processCheckout()">💳 Bayar via WhatsApp</button>
    </div>

    <script>
        const dataPackages = {
            axis: [
                { amount: "2GB 3 Hari", price: "Rp5.000" },
                { amount: "5GB 7 Hari", price: "Rp15.000" }, 
                { amount: "2GB 3 Hari", price: "Rp5.000" },
                { amount: "5GB 7 Hari", price: "Rp15.000" }, 
                { amount: "2GB 3 Hari", price: "Rp5.000" },
                { amount: "5GB 7 Hari", price: "Rp15.000" }  
            ],
            tri: [
                { amount: "3GB 3 Hari", price: "Rp7.000" },
                { amount: "6GB 7 Hari", price: "Rp20.000" }, 
                { amount: "3GB 3 Hari", price: "Rp7.000" },
                { amount: "6GB 7 Hari", price: "Rp20.000" }
                 


            ],
            telkomsel: [
                { amount: "2GB 3 Hari", price: "Rp10.000" },
                { amount: "5GB 7 Hari", price: "Rp25.000" }
            ]
        };

        function getProviderFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get("provider") || "axis";
        }

        function updatePackages(provider) {
            let nominalContainer = document.getElementById("nominal-container");
            nominalContainer.innerHTML = "";

            dataPackages[provider].forEach(option => {
                let btn = document.createElement("button");
                btn.classList.add("nominal");
                btn.innerText = `${option.amount} - ${option.price}`;
                btn.onclick = () => processCheckout(provider, option.amount, option.price);
                nominalContainer.appendChild(btn);
            });

            document.getElementById("provider-title").innerText = `Paket Data ${provider.toUpperCase()}`;
        }

        function processCheckout(provider, amount, price) {
            let phone = document.getElementById("phone-number").value;
            if (!phone) {
                alert("⚠️ Masukkan nomor HP terlebih dahulu!");
                return;
            }

            let waNumber = "62895401353937";
            let message = `Halo, saya ingin membeli paket ${amount} untuk ${provider.toUpperCase()}.\n📱 Nomor HP: ${phone}\n💰 Harga: ${price}`;
            let waLink = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;
            window.location.href = waLink;
        }

        window.onload = function () {
            let provider = getProviderFromURL();
            updatePackages(provider);
        };
    </script>
</body>
</html>
