<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paket Data & Top-Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Paket Data & Top-Up</h1>
    </header>
    <main>
        <section id="paket-data">
            <h2>Pilih Paket Data</h2>
            <div class="paket-container" id="paket-list"></div>
        </section>
        <section id="topup">
            <h2>Top-Up Saldo</h2>
            <div class="topup-container" id="topup-list"></div>
        </section>
    </main>
    <h2>Tambah Top-Up Game</h2>
<form id="game-form">
    <label for="game-nama">Pilih Game:</label>
    <div class="game-selection">
        <input type="radio" id="ff" name="game" value="Free Fire" data-image="assets/ff.png">
        <label for="ff"><img src="assets/ff.png" alt="Free Fire"></label>

        <input type="radio" id="ml" name="game" value="Mobile Legends" data-image="assets/ml.png">
        <label for="ml"><img src="assets/ml.png" alt="Mobile Legends"></label>

        <input type="radio" id="efootball" name="game" value="eFootball" data-image="assets/efootball.png">
        <label for="efootball"><img src="assets/efootball.png" alt="eFootball"></label>
    </div>

    <label for="game-nominal">Nominal:</label>
    <input type="text" id="game-nominal" required>

    <label for="game-harga">Harga:</label>
    <input type="text" id="game-harga" required>

    <button type="submit">Tambah Top-Up Game</button>
</form>

    <script src="script.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
