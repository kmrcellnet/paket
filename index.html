<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codashop Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Top-Up Game & Paket Internet Termurah</h1>
    </header>

    <main>
        <h2>Top-Up Game</h2>
        <div class="game-list">
            <div class="game" onclick="openGame('ml')">
                <img src="assets/ml.png" alt="Mobile Legends">
                <p>Mobile Legends</p>
            </div>
            <div class="game" onclick="openGame('ff')">
                <img src="assets/ff.png" alt="Free Fire">
                <p>Free Fire</p>
            </div>
            <div class="game" onclick="openGame('pubg')">
                <img src="assets/pubg.png" alt="PUBG Mobile">
                <p>PUBG Mobile</p>
            </div>
        </div>

        <h2>Paket Internet</h2>
        <div class="game-list">
            <div class="game" onclick="openData('axis')">
                <img src="assets/axis.png" alt="Axis">
                <p>Axis</p>
            </div>
            <div class="game" onclick="openData('tri')">
                <img src="assets/tri.png" alt="Tri">
                <p>Tri</p>
            </div>
            <div class="game" onclick="openData('telkomsel')">
                <img src="assets/telkomsel.png" alt="Telkomsel">
                <p>Telkomsel</p>
            </div>
        </div>
    </main>

    <script>
        function openGame(game) {
            window.location.href = `checkout.html?game=${game}`;
        }

        function openData(provider) {
            window.location.href = `checkout-data.html?provider=${provider}`;
        }
    </script>
</body>
</html>
