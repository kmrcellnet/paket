<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codashop Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Top-Up Game Termurah</h1>
    </header>

    <main>
        <div class="game-list">
            <div class="game" onclick="openGame('Mobile Legends')">
                <img src="assets/ml.png" alt="Mobile Legends">
                <p>Mobile Legends</p>
            </div>
            <div class="game" onclick="openGame('Free Fire')">
                <img src="assets/ff.png" alt="Free Fire">
                <p>Free Fire</p>
            </div>
            <div class="game" onclick="openGame('PUBG Mobile')">
                <img src="assets/pubg.png" alt="PUBG Mobile">
                <p>PUBG Mobile</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
