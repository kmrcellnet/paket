<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Top-Up</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        /* Container */
        .checkout-container {
            background: #1e1e1e;
            max-width: 420px;
            width: 100%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        h2 {
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 22px;
            text-align: center;
            white-space: normal;
            overflow: visible;
            word-wrap: break-word;
        }

        /* Kotak Input ID Game */
        .box {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 3px 5px rgba(255, 255, 255, 0.1);
            text-align: left;
        }

        .box label {
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        .box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 16px;
            background: #222;
            color: #ffffff;
        }

        .lookup-btn {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Pilihan Produk */
        .nominal-container {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 3px 5px rgba(255, 255, 255, 0.1);
        }

        .nominal-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .nominal {
            background: #28a745;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 3px 5px rgba(255, 255, 255, 0.1);
        }

        .nominal:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .nominal.selected {
            background: #ffc107;
            color: black;
            font-weight: bold;
            transform: scale(1.1);
        }

        /* Tombol Pembayaran */
        .pay-btn {
            background: #25D366;
            color: white;
            border: none;
            cursor: pointer;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            display: block;
            margin-top: 20px;
            text-align: center;
        }

        .pay-btn:hover {
            background: #1DA851;
            transform: scale(1.05);
        }

        /* Responsif */
        @media (max-width: 480px) {
            .checkout-container {
                width: 90%;
                max-width: 400px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <h2 id="game-title">Top-Up</h2>

        <!-- Kotak ID Game -->
        <div class="box">
            <label for="user-id">🆔 Masukkan ID Game:</label>
            <input type="text" id="user-id" placeholder="Masukkan ID Anda">
            <input type="text" id="zone-id" placeholder="Zone ID (Opsional)">
            <button class="lookup-btn">🔍 Cek Username</button>
        </div>

        <!-- Pilihan Produk -->
        <div class="nominal-container">
            <label>💎 Pilih Produk:</label>
            <div class="nominal-list" id="nominal-container"></div>
        </div>

        <!-- Tombol Bayar -->
        <button class="pay-btn" onclick="processCheckout()">💳 Bayar Lewat WhatsApp</button>
    </div>

    <script>
        const nominalOptions = {
            ml: [
                { amount: "86 💎", price: "Rp15.000" },
                { amount: "172 💎", price: "Rp30.000" }
            ],
            ff: [
                { amount: "70 💎", price: "Rp10.000" },
                { amount: "140 💎", price: "Rp20.000" }
            ],
            pubg: [
                { amount: "60 UC", price: "Rp15.000" },
                { amount: "180 UC", price: "Rp45.000" },
                { amount: "600 UC", price: "Rp150.000" },
                { amount: "1500 UC", price: "Rp375.000" }
            ]
        };

        function getGameFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get("game") || "ml";
        }

        function updateNominal(game) {
            let nominalContainer = document.getElementById("nominal-container");
            nominalContainer.innerHTML = "";

            nominalOptions[game].forEach(option => {
                let btn = document.createElement("button");
                btn.classList.add("nominal");
                btn.setAttribute("data-amount", option.amount);
                btn.setAttribute("data-price", option.price);
                btn.innerText = `${option.amount} - ${option.price}`;
                btn.onclick = function () {
                    document.querySelectorAll(".nominal").forEach(btn => btn.classList.remove("selected"));
                    this.classList.add("selected");
                };
                nominalContainer.appendChild(btn);
            });

            let gameTitle = "Top-Up ";
            if (game === "ml") gameTitle += "Mobile Legends";
            else if (game === "ff") gameTitle += "Free Fire";
            else if (game === "pubg") gameTitle += "PUBG Mobile";

            document.getElementById("game-title").textContent = gameTitle;
        }

        function processCheckout() {
            let userID = document.getElementById("user-id").value.trim();
            let selectedNominal = document.querySelector(".nominal.selected");

            if (!selectedNominal || !userID) {
                alert("⚠️ Masukkan ID Game dan pilih nominal terlebih dahulu!");
                return;
            }

            let nominal = selectedNominal.getAttribute("data-amount");
            let price = selectedNominal.getAttribute("data-price");
            alert(`Checkout: ${nominal}, Harga: ${price}`);
        }

        window.onload = function () {
            updateNominal(getGameFromURL());
        };
    </script>
</body>
</html>
