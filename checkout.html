<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Top-Up</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        /* Container Checkout */
        .checkout-container {
            background: #1e1e1e;
            max-width: 400px;
            width: 100%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        /* Efek Animasi */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Judul */
        h2 {
            color: #ffffff;
            margin-bottom: 15px;
        }

        /* Input Form */
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 16px;
            background: #222;
            color: #ffffff;
            transition: 0.3s;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        /* Tombol Cek Username */
        .lookup-btn {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .lookup-btn:hover {
            background: #0056b3;
        }

        /* Pilihan Nominal */
        .nominal-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            justify-content: center;
        }

        .nominal {
            background: #28a745;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 3px 5px rgba(255, 255, 255, 0.1);
        }

        .nominal:hover {
            background: #218838;
            transform: scale(1.05);
        }

        /* Efek Pilihan Nominal */
        .nominal.selected {
            background: #ffc107;
            color: black;
            font-weight: bold;
            transform: scale(1.1);
        }

        /* Tombol Pembayaran */
        .pay-btn {
            background: #25D366;
            color: white;
            border: none;
            cursor: pointer;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            display: block;
            margin-top: 20px;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 3px 5px rgba(255, 255, 255, 0.1);
        }

        .pay-btn:hover {
            background: #1DA851;
            transform: scale(1.05);
        }

        /* Responsif */
        @media (max-width: 480px) {
            .checkout-container {
                width: 90%;
                max-width: 400px;
                padding: 15px;
            }
        }

    </style>
</head>
<body>
    <div class="checkout-container">
        <h2 id="game-title">Top-Up</h2>

        <div class="input-group">
            <label for="user-id">🆔 Masukkan ID Game:</label>
            <input type="text" id="user-id" placeholder="Masukkan ID Anda">
            <input type="text" id="zone-id" placeholder="Zone ID (Opsional)">
            <button class="lookup-btn" onclick="lookupUsername()">🔍 Cek Username</button>
            <p id="username-result"></p>
        </div>

        <div class="input-group">
            <label>💎 Pilih Produk:</label>
            <div class="nominal-list" id="nominal-container"></div>
        </div>

        <button class="pay-btn" onclick="processCheckout()">💳 Bayar Lewat WhatsApp</button>
    </div>

    <script>
        const nominalOptions = {
            ml: [
                { amount: "86 💎", price: "Rp15.000" },
                { amount: "172 💎", price: "Rp30.000" },
                { amount: "344 💎", price: "Rp60.000" },
                { amount: "514 💎", price: "Rp90.000" },
                { amount: "706 💎", price: "Rp120.000" },
                { amount: "1412 💎", price: "Rp240.000" },
                { amount: "Weekly Diamond Pass", price: "Rp29.000" },
                { amount: "Starlight Membership", price: "Rp149.000" },
                { amount: "Starlight Plus Membership", price: "Rp299.000" }
            ],
            ff: [
                { amount: "70 💎", price: "Rp10.000" },
                { amount: "140 💎", price: "Rp20.000" },
                { amount: "280 💎", price: "Rp40.000" },
                { amount: "355 💎", price: "Rp50.000" },
                { amount: "720 💎", price: "Rp100.000" },
                { amount: "1440 💎", price: "Rp200.000" }
            ]
        };

        function getGameFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get("game") || "ml";
        }

        function updateNominal(game) {
            let nominalContainer = document.getElementById("nominal-container");
            nominalContainer.innerHTML = "";

            nominalOptions[game].forEach(option => {
                let btn = document.createElement("button");
                btn.classList.add("nominal");
                btn.innerText = `${option.amount} - ${option.price}`;
                btn.setAttribute("data-amount", option.amount);
                btn.setAttribute("data-price", option.price);
                btn.onclick = function () {
                    document.querySelectorAll(".nominal").forEach(btn => btn.classList.remove("selected"));
                    this.classList.add("selected");
                };
                nominalContainer.appendChild(btn);
            });

            let gameTitle = { ml: "Mobile Legends", ff: "Free Fire" };
            document.getElementById("game-title").innerText = `Top-Up ${gameTitle[game]}`;
        }

        function processCheckout() {
            let userID = document.getElementById("user-id").value;
            let selectedNominal = document.querySelector(".nominal.selected");

            if (!selectedNominal || !userID) {
                alert("⚠️ Masukkan ID Game dan pilih nominal terlebih dahulu!");
                return;
            }

            let nominal = selectedNominal.getAttribute("data-amount");
            let price = selectedNominal.getAttribute("data-price");

            let waNumber = "62895401353937";
            let waLink = `https://wa.me/${waNumber}?text=${encodeURIComponent(`Halo, saya ingin top-up ${nominal}, harga ${price}`)}`;
            window.location.href = waLink;
        }

        window.onload = function () {
            updateNominal(getGameFromURL());
        };
    </script>
</body>
</html>
