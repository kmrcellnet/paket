<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Top-Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }

        .checkout-container {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        h2 {
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input, button {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .lookup-btn, .pay-btn {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .lookup-btn:hover {
            background: #0056b3;
        }

        .pay-btn {
            background: #dc3545;
            margin-top: 10px;
        }

        .pay-btn:hover {
            background: #c82333;
        }

        #username-result {
            margin-top: 10px;
            font-weight: bold;
        }

        .nominal-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nominal {
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 45%;
        }

        .nominal:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <h2 id="game-title">Top-Up</h2>

        <div class="input-group">
            <label for="user-id">🆔 Masukkan ID Game:</label>
            <input type="text" id="user-id" placeholder="Masukkan ID Anda">
            <input type="text" id="zone-id" placeholder="Zone ID (Opsional)">
            <button class="lookup-btn" onclick="lookupUsername()">🔍 Cek Username</button>
            <p id="username-result"></p>
        </div>

        <div class="input-group">
            <label>💎 Pilih Produk:</label>
            <div class="nominal-list" id="nominal-container"></div>
        </div>

        <button class="pay-btn" onclick="processCheckout()">💳 Bayar Sekarang</button>
    </div>

    <script>
        const nominalOptions = {
            ml: [
                { amount: "86 Diamonds", price: "Rp15.000" },
                { amount: "172 Diamonds", price: "Rp30.000" },
                { amount: "344 Diamonds", price: "Rp60.000" },
                { amount: "514 Diamonds", price: "Rp90.000" },
                { amount: "706 Diamonds", price: "Rp120.000" },
                { amount: "1412 Diamonds", price: "Rp240.000" },
                { amount: "Weekly Diamond Pass", price: "Rp29.000" },
                { amount: "Starlight Membership", price: "Rp149.000" },
                { amount: "Starlight Plus Membership", price: "Rp299.000" },
                { amount: "Twilight Pass", price: "Rp299.000" },
                { amount: "Twilight Plus Pass", price: "Rp499.000" }
            ],
            ff: [
                { amount: "70 Diamonds", price: "Rp10.000" },
                { amount: "140 Diamonds", price: "Rp20.000" },
                { amount: "280 Diamonds", price: "Rp40.000" },
                { amount: "355 Diamonds", price: "Rp50.000" },
                { amount: "720 Diamonds", price: "Rp100.000" },
                { amount: "1440 Diamonds", price: "Rp200.000" }
            ],
            pubg: [
                { amount: "60 UC", price: "Rp12.000" },
                { amount: "180 UC", price: "Rp36.000" },
                { amount: "600 UC", price: "Rp120.000" },
                { amount: "1500 UC", price: "Rp300.000" },
                { amount: "3000 UC", price: "Rp600.000" },
                { amount: "8100 UC", price: "Rp1.500.000" }
            ]
        };

        function getGameFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get("game") || "ml"; // Default ke ML jika tidak ada parameter
        }

        function updateNominal(game) {
            let nominalContainer = document.getElementById("nominal-container");
            nominalContainer.innerHTML = "";

            nominalOptions[game].forEach(option => {
                let btn = document.createElement("button");
                btn.classList.add("nominal");
                btn.innerText = `${option.amount} - ${option.price}`;
                btn.onclick = () => alert(`Anda memilih ${option.amount} dengan harga ${option.price}`);
                nominalContainer.appendChild(btn);
            });

            let gameTitle = {
                ml: "Mobile Legends",
                ff: "Free Fire",
                pubg: "PUBG Mobile"
            };

            document.getElementById("game-title").innerText = `Top-Up ${gameTitle[game]}`;
        }

        function lookupUsername() {
            let userID = document.getElementById("user-id").value;
            let zoneID = document.getElementById("zone-id").value;
            let game = getGameFromURL();
            let fullID = userID + (zoneID ? `(${zoneID})` : "");

            if (!userID) {
                alert("⚠️ Masukkan ID Game terlebih dahulu!");
                return;
            }

            let apiURL = "";
            if (game === "ml") {
                apiURL = `https://api.codashop.com/id/lookup?user_id=${fullID}`;
            } else if (game === "ff") {
                apiURL = `https://api.fflookup.com/?user_id=${userID}`;
            } else if (game === "pubg") {
                apiURL = `https://api.pubglookup.com/?user_id=${userID}`;
            }

            fetch(apiURL)
                .then(response => response.json())
                .then(data => {
                    if (data.username) {
                        document.getElementById("username-result").innerText = `👤 Username: ${data.username}`;
                    } else {
                        document.getElementById("username-result").innerText = "❌ ID tidak ditemukan!";
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById("username-result").innerText = "⚠️ Gagal mengambil data.";
                });
        }

        function processCheckout() {
            alert("✅ Pembayaran berhasil!");
        }

        // Set game dari URL saat halaman dimuat
        window.onload = function () {
            let gameFromURL = getGameFromURL();
            updateNominal(gameFromURL);
        };
    </script>
</body>
</html>
