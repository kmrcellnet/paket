<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Up & Paket Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
        }
        header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 15px;
    border-bottom: 2px solid #e0e0e0;
}
.provider-logo {
    width: 50px;  /* Sesuaikan ukuran logo */
    height: auto;
    display: block;
    margin: 0 auto 10px;
}


.logo img {
    height: 50px; /* Sesuaikan ukuran logo */
    width: auto;
    display: block; /* Hindari margin ekstra */
}

.icons {
    display: flex;
    align-items: center;
}

.icons span {
    margin-left: 15px;
    cursor: pointer;
    font-size: 16px;
    color: green;
}
/* Efek muncul perlahan saat pertama kali dimuat */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(0.8);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Efek berputar saat loading */
@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

.logo img {
    height: 50px; /* Sesuaikan ukuran logo */
    width: auto;
    display: block;
    animation: fadeIn 1s ease-in-out; /* Animasi muncul */
    transition: transform 0.3s ease-in-out;
}

/* Efek hover: membesar sedikit */
.logo img:hover {
    transform: scale(1.1);
}

/* Efek berputar selama 2 detik saat loading */
.logo img.loading {
    animation: spin 2s linear infinite;
}
        .input-section, .topup-section {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 8px;
        }
        .input-section label {
            font-weight: bold;
        }
        .input-section input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .tab {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .tab button {
            padding: 10px;
            border: none;
            background: lightgray;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab .active {
            background: green;
            color: white;
        }
        .product {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-top: 10px;
        }
        .product h3 {
            margin: 5px 0;
        }
        .product .price {
            color: red;
            font-weight: bold;
        }
        .buy-btn {
            background: green;
            color: white;
            padding: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
    <div class="logo">
        <img src="img/logo.png" alt="">
    </div>
    <div class="icons">
        <span class="search">🔍</span>
        <span class="user">👤</span>
        <span class="transaction">Transaksi</span>
    </div>
</header>

    <main>
        <section class="input-section">
            <label for="nomorHP">Masukan Nomor HP📱</label>
            <input type="text" id="nomorHP" placeholder="Masukan Nomor HP" oninput="validateNumber(this)">
        </section>

        <section class="topup-section">
            <h2>Pilih Nominal Top Up</h2>
            <div class="tab">
                <button class="active" id="btnPulsa">Pulsa</button>
                <button id="btnPaketData">Paket Data</button>
            </div>
            <div id="productList"></div>
            

        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const params = new URLSearchParams(window.location.search);
            const provider = params.get("provider") || "AXIS"; // Default ke AXIS jika tidak ada provider

            // Data produk
            const products = {
                "AXIS": {
            pulsa: [
                { name: "Pulsa AXIS 5.000", description: "Pulsa reguler", price: "Rp 7.000" },
                { name: "Pulsa AXIS 10.000", description: "Pulsa reguler", price: "Rp 12.000" },
                { name: "Pulsa AXIS 15.000", description: "Pulsa reguler", price: "Rp 17.000" },
                { name: "Pulsa AXIS 20.000", description: "Pulsa reguler", price: "Rp 22.000" }
              
            ],
            paketData: [
                { name: "AXIS 2,5GB 5 Hari", description: "Kuota 24 jam", price: "Rp 13.000" },
                { name: "AXIS 2GB 3 Hari", description: "Kuota 24 jam", price: "Rp 11.000" },
                { name: "AXIS 1,5GB 3 Hari", description: "Kuota 24 jam", price: "Rp 10.000" },
               
            ]
        },
        "BYU": {
            pulsa: [
                { name: "tidak tersedia", description: "Pulsa reguler", price: "Rp 6.500" },
                { name: "tidak tersedia", description: "Pulsa reguler", price: "Rp 12.000" }
            ],
            paketData: [
                { name: "tidak tersedia", description: "Kuota all net", price: "Rp 20.000" },
                { name: "tidak tersedia", description: "Kuota utama", price: "Rp 50.000" }
            ]
        },
        "INDOSAT": {
            pulsa: [
                { name: "tidak tersedia", description: "Pulsa reguler", price: "Rp 6.500" },
                { name: "tidak tersedia", description: "Pulsa reguler", price: "Rp 12.000" }
            ],
            paketData: [
                { name: "IM3 tidak tersedia Freedom", description: "Berlaku 30 Hari", price: "Rp 30.000" },
                { name: "IM3 tidak tersedia Freedom", description: "Berlaku 30 Hari", price: "Rp 60.000" }
            ]
        },
        "SMARTFREN": {
            pulsa: [
                { name: "Pulsa Smartfren 5.000", description: "Pulsa reguler", price: "Rp 6.500" },
                { name: "Pulsa Smartfren 10.000", description: "Pulsa reguler", price: "Rp 12.000" }
            ],
            paketData: [
                { name: "Smartfren 2GB", description: "Berlaku 7 Hari", price: "Rp 12.000" },
                { name: "Smartfren 10GB", description: "Berlaku 30 Hari", price: "Rp 45.000" }
            ]
        },
        "TELKOMSEL": {
            pulsa: [
                { name: "Pulsa Telkomsel 5.000", description: "Pulsa reguler", price: "Rp 7.000" },
                { name: "Pulsa Telkomsel 10.000", description: "Pulsa reguler", price: "Rp 12.000" }
            ],
            paketData: [
                { name: "Telkomsel 3GB", description: "Berlaku 5 Hari", price: "Rp 12.500" },
                { name: "Telkomsel 1,5GB", description: "Berlaku 3 Hari", price: "Rp 8.000" }
            ]
        },
        "THREE": {
            pulsa: [
                { name: "Pulsa Tri 5.000", description: "Pulsa reguler", price: "Rp 7.000" },
                { name: "Pulsa Tri 10.000", description: "Pulsa reguler", price: "Rp 12.000" },
                { name: "Pulsa Tri 15.000", description: "Pulsa reguler", price: "Rp 17.000" },
                { name: "Pulsa Tri 20.000", description: "Pulsa reguler", price: "Rp 22.000" }
            ],
            paketData: [
                { name: "Tri 3GB 3 Hari", description: "Kuota reguler", price: "Rp 11.000" },
                { name: "Tri 2GB 5 Hari", description: "Kuota reguler", price: "Rp 12.000" },
                { name: "Tri 1,5GB 7 Hari", description: "Kuota reguler", price: "Rp 11.000" }
            ]
        },
        "XL": {
            pulsa: [
                { name: "Pulsa XL 5.000", description: "Pulsa reguler", price: "Rp 7.000" },
                { name: "Pulsa XL 10.000", description: "Pulsa reguler", price: "Rp 12.000" },
                { name: "Pulsa XL 15.000", description: "Pulsa reguler", price: "Rp 17.000" },
                { name: "Pulsa XL 20.000", description: "Pulsa reguler", price: "Rp 22.000" }
           
            ],
            paketData: [
                { name: "XL 5GB Combo", description: "Berlaku 30 Hari", price: "Rp 25.000" },
                { name: "XL 20GB Combo", description: "Berlaku 30 Hari", price: "Rp 75.000" }
            ]
        }
    };

            // Fungsi load produk
            function loadProducts(type) {
                const productList = document.getElementById("productList");
                productList.innerHTML = ""; 

                if (products[provider] && products[provider][type]) {
                    products[provider][type].forEach(product => {
                        const productElement = document.createElement("div");
                        productElement.classList.add("product");
                        productElement.innerHTML = `
                            <h3>${product.name}</h3>
                            <p class="price">${product.price}</p>
                            <button class="buy-btn" onclick="checkout('${product.name}', '${product.price}')">beli</button>
                        `;
                        productList.appendChild(productElement);
                    });
                } else {
                    productList.innerHTML = `<p>Tidak ada produk tersedia.</p>`;
                }
            }

            // Tombol pulsa & paket data
            document.getElementById("btnPulsa").addEventListener("click", function() {
                document.querySelector(".tab .active").classList.remove("active");
                this.classList.add("active");
                loadProducts("pulsa");
            });

            document.getElementById("btnPaketData").addEventListener("click", function() {
                document.querySelector(".tab .active").classList.remove("active");
                this.classList.add("active");
                loadProducts("paketData");
            });

            // Load default pulsa
            loadProducts("pulsa");
        });

        // Validasi nomor HP (hanya angka)
        function validateNumber(input) {
            input.value = input.value.replace(/\D/g, '').substring(0, 13);
        }

        function checkout(name, price) {
    const nomorHP = document.getElementById("nomorHP").value;
    if (!nomorHP || nomorHP.length < 10) {
        alert("Masukkan nomor HP yang valid!");
        return;
    }

    // Nomor WhatsApp tujuan (ganti dengan nomor admin)
    const waNumber = "62895401353937"; // Gunakan format internasional (62 untuk Indonesia)

    // Format pesan
    const message = `📢 Halo! Saya ingin membeli *${name}*  
💰 Harga: *${price}*  
📱 Nomor tujuan: *${nomorHP}*  
✅ Mohon konfirmasinya, terima kasih!`;

    // Encode URL
    const waLink = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;

    // Arahkan ke WhatsApp
    window.location.href = waLink;
}

    </script>
</body>
</html>
