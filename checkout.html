<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Top-Up ML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }

        .checkout-container {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        h2 {
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .lookup-btn {
            background: #007bff;
            color: white;
            padding: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .lookup-btn:hover {
            background: #0056b3;
        }

        #username-result {
            margin-top: 10px;
            font-weight: bold;
        }

        .nominal-list {
            display: flex;
            justify-content: space-between;
        }

        .nominal {
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 30%;
        }

        .nominal:hover {
            background: #218838;
        }

        .pay-btn {
            background: #dc3545;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .pay-btn:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <h2>Top-Up Mobile Legends</h2>

        <div class="input-group">
            <label for="user-id">🎮 Masukkan ID Game:</label>
            <input type="text" id="user-id" placeholder="Masukkan ID Anda">
            <input type="text" id="zone-id" placeholder="Zone ID (Opsional)">
            <button class="lookup-btn" onclick="lookupUsername()">🔍 Cek Username</button>
            <p id="username-result"></p>
        </div>

        <div class="input-group">
            <label for="amount">💎 Pilih Nominal:</label>
            <div class="nominal-list">
                <button class="nominal" data-value="10000">10 Diamonds - Rp10.000</button>
                <button class="nominal" data-value="50000">50 Diamonds - Rp50.000</button>
                <button class="nominal" data-value="100000">100 Diamonds - Rp100.000</button>
            </div>
        </div>

        <button class="pay-btn" onclick="processCheckout()">💳 Bayar Sekarang</button>
    </div>

    <script>
        function lookupUsername() {
            let userID = document.getElementById("user-id").value;
            let zoneID = document.getElementById("zone-id").value;

            if (!userID) {
                alert("⚠️ Masukkan ID Game terlebih dahulu!");
                return;
            }

            let fullID = `${userID}(${zoneID})`;

            fetch(`https://api.codashop.com/id/lookup?user_id=${fullID}`)
                .then(response => response.json())
                .then(data => {
                    if (data.username) {
                        document.getElementById("username-result").innerText = `👤 Username: ${data.username}`;
                    } else {
                        document.getElementById("username-result").innerText = "❌ ID tidak ditemukan!";
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById("username-result").innerText = "⚠️ Gagal mengambil data.";
                });
        }

        function processCheckout() {
            alert("✅ Pembayaran berhasil!");
        }
    </script>
</body>
</html>
