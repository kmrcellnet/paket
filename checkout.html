<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Checkout Top-Up</h1>
    </header>

    <main>
        <h2 id="game-title"></h2>
        <label for="user-id">Masukkan ID Game:</label>
        <input type="text" id="user-id" placeholder="Masukkan ID Anda">

        <label for="amount">Pilih Nominal:</label>
        <select id="amount">
            <option value="10000">10 Diamonds - Rp10.000</option>
            <option value="50000">50 Diamonds - Rp50.000</option>
            <option value="100000">100 Diamonds - Rp100.000</option>
        </select>

        <button onclick="processCheckout()">Bayar Sekarang</button>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const game = urlParams.get('game');
            document.getElementById('game-title').innerText = `Top-Up ${game}`;
        });

        function processCheckout() {
            alert("Pembayaran berhasil!");
        }
    </script>
</body>
</html>
