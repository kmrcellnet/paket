<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Top-Up</title>
    <style>
        /* Gaya Dasar */
body {
    font-family: 'Poppins', sans-serif;
    background-color: #f8f9fa;
    text-align: center;
    padding: 20px;
    margin: 0;
}

/* Container Checkout */
.checkout-container {
    background: white;
    max-width: 400px;
    margin: auto;
    padding: 20px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    border-radius: 10px;
    text-align: left;
    animation: fadeIn 0.5s ease-in-out;
}

/* Efek Animasi */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Judul */
h2 {
    color: #343a40;
    text-align: center;
}

/* Input Form */
.input-group {
    margin-bottom: 15px;
}

label {
    font-weight: 600;
    display: block;
    margin-bottom: 5px;
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ced4da;
    border-radius: 5px;
    font-size: 16px;
    transition: 0.3s;
}

input:focus {
    border-color: #007bff;
    outline: none;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
}

/* Tombol Cek Username */
.lookup-btn {
    width: 100%;
    padding: 12px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.lookup-btn:hover {
    background: #0056b3;
}

/* Hasil Pengecekan */
#username-result {
    margin-top: 10px;
    font-weight: bold;
    color: #333;
    text-align: center;
}

/* Pilihan Nominal */
.nominal-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); /* 2 kolom fleksibel */
    gap: 10px;
    justify-content: center;
}

.nominal {
    background: #28a745;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    transition: 0.3s;
}

.nominal:hover {
    background: #218838;
}

/* Efek Pilihan Nominal */
.nominal.selected {
    background: #ffc107;
    color: black;
    font-weight: bold;
}

/* Responsif untuk layar sangat kecil (misal 320px) */
@media (max-width: 320px) {
    .nominal-list {
        grid-template-columns: repeat(2, minmax(100px, 1fr)); /* Pastikan tetap 2 kolom */
}

/* Tombol Pembayaran */
.pay-btn {
    background: #25D366;
    color: white;
    border: none;
    cursor: pointer;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 5px;
    width: 100%;  /* Tombol penuh dalam container */
    display: block;
    margin: 20px auto;  /* Tengah secara horizontal */
    text-align: center;
    transition: 0.3s;
}
    
/* Pilihan Nominal */
.nominal-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); /* 2 kolom fleksibel */
    gap: 10px;
    justify-content: center;
}

.nominal {
    background: #28a745;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    transition: 0.3s;
}

.nominal:hover {
    background: #218838;
}

/* Efek Pilihan Nominal */
.nominal.selected {
    background: #ffc107;
    color: black;
    font-weight: bold;
}

/* Responsif untuk layar sangat kecil (misal 320px) */
@media (max-width: 320px) {
    .nominal-list {
        grid-template-columns: repeat(2, minmax(100px, 1fr)); /* Pastikan tetap 2 kolom */
    }
}

/* Tombol Pembayaran */
.pay-btn {
    background: #25D366;
    color: white;
    border: none;
    cursor: pointer;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 5px;
    width: 100%;  /* Tombol penuh dalam container */
    display: block;
    margin: 20px auto;  /* Tengah secara horizontal */
    text-align: center;
    transition: 0.3s;
}

.pay-btn:hover {
    background: #1DA851;
}

/* Responsif */
@media (max-width: 480px) {
    .checkout-container {
        width: 90%;
        max-width: 400px; /* Tambahan agar lebih rapi */
        padding: 15px;
        margin: auto; /* Tengah */
    }

    .nominal-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr); /* Tetap 2 kolom */
        gap: 10px;
    }

    .nominal {
        width: 100%;
    }
}

    </style>
</head>
<body>
    <div class="checkout-container">
        <h2 id="game-title">Top-Up</h2>

        <div class="input-group">
            <label for="user-id">🆔 Masukkan ID Game:</label>
            <input type="text" id="user-id" placeholder="Masukkan ID Anda">
            <input type="text" id="zone-id" placeholder="Zone ID (Opsional)">
            <button class="lookup-btn" onclick="lookupUsername()">🔍 Cek Username</button>
            <p id="username-result"></p>
        </div>

        <div class="input-group">
            <label>💎 Pilih Produk:</label>
            <div class="nominal-list" id="nominal-container"></div>
        </div>

        <button class="pay-btn" onclick="processCheckout()">💳 Bayar Lewat WhatsApp</button>
    </div>

    <script>
        const nominalOptions = {
            ml: [
                { amount: "86 Diamonds", price: "Rp15.000" },
                { amount: "172 Diamonds", price: "Rp30.000" },
                { amount: "344 Diamonds", price: "Rp60.000" },
                { amount: "514 Diamonds", price: "Rp90.000" },
                { amount: "706 Diamonds", price: "Rp120.000" },
                { amount: "1412 Diamonds", price: "Rp240.000" },
                { amount: "Weekly Diamond Pass", price: "Rp29.000" },
                { amount: "Starlight Membership", price: "Rp149.000" },
                { amount: "Starlight Plus Membership", price: "Rp299.000" }
            ],
            ff: [
                { amount: "70 Diamonds", price: "Rp10.000" },
                { amount: "140 Diamonds", price: "Rp20.000" },
                { amount: "280 Diamonds", price: "Rp40.000" },
                { amount: "355 Diamonds", price: "Rp50.000" },
                { amount: "720 Diamonds", price: "Rp100.000" },
                { amount: "1440 Diamonds", price: "Rp200.000" }
            ],
            pubg: [
                { amount: "60 UC", price: "Rp12.000" },
                { amount: "180 UC", price: "Rp36.000" },
                { amount: "600 UC", price: "Rp120.000" },
                { amount: "1500 UC", price: "Rp300.000" },
                { amount: "3000 UC", price: "Rp600.000" }
            ]
        };

        function getGameFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get("game") || "ml";
        }

        function updateNominal(game) {
            let nominalContainer = document.getElementById("nominal-container");
            nominalContainer.innerHTML = "";

            nominalOptions[game].forEach(option => {
                let btn = document.createElement("button");
                btn.classList.add("nominal");
                btn.innerText = `${option.amount} - ${option.price}`;
                btn.setAttribute("data-amount", option.amount);
                btn.setAttribute("data-price", option.price);
                btn.onclick = function () {
                    document.querySelectorAll(".nominal").forEach(btn => btn.classList.remove("selected"));
                    this.classList.add("selected");
                };
                nominalContainer.appendChild(btn);
            });

            let gameTitle = {
                ml: "Mobile Legends",
                ff: "Free Fire",
                pubg: "PUBG Mobile"
            };

            document.getElementById("game-title").innerText = `Top-Up ${gameTitle[game]}`;
        }

        function processCheckout() {
            let userID = document.getElementById("user-id").value;
            let zoneID = document.getElementById("zone-id").value;
            let game = getGameFromURL();
            let gameTitle = {
                ml: "Mobile Legends",
                ff: "Free Fire",
                pubg: "PUBG Mobile"
            };

            let selectedNominal = document.querySelector(".nominal.selected");
            if (!selectedNominal) {
                alert("⚠️ Pilih nominal terlebih dahulu!");
                return;
            }

            let nominal = selectedNominal.getAttribute("data-amount");
            let price = selectedNominal.getAttribute("data-price");

            if (!userID) {
                alert("⚠️ Masukkan ID Game terlebih dahulu!");
                return;
            }

            let fullID = userID + (zoneID ? `(${zoneID})` : "");
            let waNumber = "62895401353937"; // Ganti dengan nomor admin WhatsApp
            let message = `Halo, saya ingin top-up ${gameTitle[game]}.\n\n` +
                          `🆔 ID Game: ${fullID}\n` +
                          `💎 Produk: ${nominal}\n` +
                          `💰 Harga: ${price}\n\n` +
                          `Mohon konfirmasi pembayaran. Terima kasih!`;

            let waLink = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;
            window.location.href = waLink;
        }

        window.onload = function () {
            let gameFromURL = getGameFromURL();
            updateNominal(gameFromURL);
        };
    </script>
</body>
</html>
