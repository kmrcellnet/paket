<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Top-Up</title>
    <link rel="stylesheet" href="">
</head>
<body>
    <div class="checkout-container">
        <h2 id="game-title"></h2>

        <div class="input-group">
            <label for="user-id">🎮 Masukkan ID Game:</label>
            <input type="text" id="user-id" placeholder="Masukkan ID Anda">
        </div>

        <div class="input-group">
            <label for="amount">💎 Pilih Nominal:</label>
            <div class="nominal-list">
                <button class="nominal" data-value="10000">10 Diamonds - Rp10.000</button>
                <button class="nominal" data-value="50000">50 Diamonds - Rp50.000</button>
                <button class="nominal" data-value="100000">100 Diamonds - Rp100.000</button>
            </div>
        </div>

        <button class="pay-btn" onclick="processCheckout()">💳 Bayar Sekarang</button>
    </div>
    <style>
        /* RESET CSS */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Arial', sans-serif;
}

/* BODY STYLE */
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(135deg, #007bff, #00c6ff);
    color: #fff;
}

/* CONTAINER */
.checkout-container {
    background: #fff;
    color: #333;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    width: 300px;
    text-align: center;
}

/* JUDUL */
.checkout-container h2 {
    margin-bottom: 15px;
}

/* INPUT GROUP */
.input-group {
    margin: 15px 0;
    text-align: left;
}

.input-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

.input-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

/* NOMINAL PILIHAN */
.nominal-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.nominal {
    flex: 1;
    padding: 10px;
    background: #eee;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.3s;
}

.nominal:hover {
    background: #007bff;
    color: white;
}

.nominal.selected {
    background: #28a745;
    color: white;
}

/* TOMBOL BAYAR */
.pay-btn {
    width: 100%;
    padding: 12px;
    background: #ff5722;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.pay-btn:hover {
    background: #e64a19;
}

    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const game = urlParams.get('game');
            document.getElementById('game-title').innerText = `Top-Up ${game}`;

            // Pilih nominal dengan efek klik
            document.querySelectorAll(".nominal").forEach(button => {
                button.addEventListener("click", function() {
                    document.querySelectorAll(".nominal").forEach(btn => btn.classList.remove("selected"));
                    this.classList.add("selected");
                });
            });
        });

        function processCheckout() {
            alert("✅ Pembayaran berhasil!");
        }
    </script>
</body>
</html>
