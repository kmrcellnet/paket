<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beli Token Listrik</title>
</head>
<body>
    <h1>Beli Token Listrik</h1>
    <form id="tokenForm">
        <input type="text" id="user" placeholder="Nama Pengguna" required />
        <input type="text" id="nomorMeter" placeholder="Nomor Meter" required />
        <input type="number" id="jumlah" placeholder="Jumlah Token" required />
        <button type="submit">Beli Token</button>
    </form>
    <div id="result"></div>

    <script>
        document.getElementById("tokenForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const user = document.getElementById("user").value;
            const nomorMeter = document.getElementById("nomorMeter").value;
            const jumlah = document.getElementById("jumlah").value;

            const response = await fetch('/api/beli-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, nomorMeter, jumlah })
            });

            const data = await response.json();
            document.getElementById("result").innerText = data.message + ": " + data.token;
        });
    </script>
</body>
</html>
